<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Rayz Tech - Web development, cybersecurity and technical solutions."
    >

    <title>{% block title %}Kennedy Kioko{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!-- NAVIGATION -->
    <header class="navbar">
        <div class="container nav-container">

            <a href="/" class="logo">
                <img src="" alt="">Kennedy<span>Kioko</span>
            </a>

            <button class="menu-toggle" id="menuToggle">
                ☰
            </button>

            <nav class="nav-links" id="navLinks">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#skills">Skills</a>
                <a href="#projects">Projects</a>
                <a href="#services">Services</a>
                <a href="#contact">Contact Us</a>
            </nav>

        </div>
    </header>


    {% block content %}
    {% endblock %}


    <footer class="footer">

        <div class="container footer-content">

            <div>
                <a href="/" class="logo">
                    Kennedy<span>Kioko</span>
                </a>

                <p>
                    Building digital solutions. Securing the future.
                </p>
            </div>

            <div class="footer-links">
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact Us</a>
            </div>

        </div>

        <div class="copyright">
            &copy; 2026 Rayz Tech. All rights reserved.
        </div>

    </footer>


    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
