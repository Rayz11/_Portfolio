<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Rayz Tech</title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/admin.css'
        ) }}"
    >

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                RAYZ<span>TECH</span>
            </div>

            <p class="login-label">
                ADMINISTRATION PANEL
            </p>

            <h1>Welcome back.</h1>

            <p class="login-description">
                Sign in to manage your Rayz Tech portfolio.
            </p>


            {% with messages = get_flashed_messages(
                with_categories=true
            ) %}

                {% for category, message in messages %}

                    <div class="alert">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endwith %}


            <form method="POST">

                <div class="form-group">

                    <label>
                        Username or Email
                    </label>

                    <input
                        type="text"
                        name="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-button"
                >
                    Sign In
                </button>

            </form>

        </div>

    </div>

</body>

</html>
